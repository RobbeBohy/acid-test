stacie_v1.0.0_lorentz:
  program: STACIE
  version: "1.0.0"
  settings:
  - "`model = LorentzModel()`"
  - "`neff_max = max(1024, N / 8)`"
  - default settings otherwise
stacie_v1.0.0_quad:
  program: STACIE
  version: "1.0.0"
  settings:
  - "`model = ExpPolyModel([0, 2])`"
  - "`neff_max = max(1024, N / 8)`"
  - default settings otherwise
